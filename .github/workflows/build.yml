name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar con Maven
        run: mvn -B -q compile
      - name: Ejecutar todas las demos
        run: bash scripts/ejecutar.sh > /dev/null
